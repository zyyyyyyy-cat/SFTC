MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'wrt'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  TRANSFORMER_TYPE: 'vit_base_in'
  STRIDE_SIZE: [16, 16]
  PCA_LOSS_WEIGHT: 0.01
  GPD_MOMENTUM: 0.2

SFTC:
  ENABLED: True
  BLOCK_INDEX: 6
  LOCAL_GRID: [16, 8]
  CNN_CHANNELS: [32, 64, 128]
  EMBED_DIM: 768
  POS_SCALE: 0.1
  SOURCE_BIAS_INIT: -2.0
  SOURCE_BIAS_FIXED_EPOCHS: 5
  NEW_LR_MULT: 3.0
  DIAGNOSTICS: True
  TEST_LOCAL_ENABLED: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/project/code/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.008
  IMS_PER_BATCH: 64
  SEED: 1234
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  GRAD_CLIP_NORM: 1.0
  LOSS_TYPE: 'base+pca+gpd'

TEST:
  IMS_PER_BATCH: 512
  RE_RANKING: False
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/UAD_SFTC_V2_1_1000'
